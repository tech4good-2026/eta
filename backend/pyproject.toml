[project]
name = "tech4good-backend"
version = "0.1.0"
description = "Tech4Good accessible navigation backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "jsonschema[format]>=4.23,<5.0",
  "openapi-spec-validator>=0.7,<0.8",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "pyyaml>=6.0,<7.0",
  "respx>=0.22,<1.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
