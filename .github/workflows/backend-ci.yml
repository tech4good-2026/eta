name: App CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/openapi.yaml"
      - "mocks/**"
      - "scripts/validate_contracts.py"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python dependencies
        run: uv sync --project backend --locked --all-groups

      - name: Lint
        run: uv run --project backend ruff check backend

      - name: Run backend tests
        run: uv run --project backend pytest backend/tests

      - name: Validate OpenAPI and frontend fixtures
        run: uv run --project backend python scripts/validate_contracts.py

      - name: Build Docker image
        run: docker build -t tech4good-backend:ci .

      - name: Smoke-test Docker health endpoint
        run: |
          docker run --detach --name tech4good-backend-ci --publish 8000:8000 \
            --env ROUTE_PROVIDER=mock tech4good-backend:ci
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs tech4good-backend-ci
          exit 1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm test --prefix frontend

      - name: Type-check frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
          VITE_KAKAO_MAP_APP_KEY: ci-placeholder
