<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">응답에 담을 수 있는 사실의 경계</title><desc id="desc">모드 선택 → 공급자 조회 → 사실 구분 → 응답·화면. 실 API 모드에서는 빠진 정보를 합성 값으로 채우지 않습니다. 실패한 조회는 정상 캐시로 남기지 않습니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="440" fill="#ffffff"/>
<g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#0f172a">
<rect x="48" y="47" width="5" height="39" fill="#2563eb"/><text x="72" y="79" font-size="32" font-weight="700">응답에 담을 수 있는 사실의 경계</text>
<rect x="48" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="72" y="213" font-size="27" font-weight="700">모드 선택</text><text x="72" y="254" font-size="19" fill="#475569">DEMO / LIVE</text><path d="M 286 228 H 330" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="364" y="213" font-size="27" font-weight="700">공급자 조회</text><text x="364" y="254" font-size="19" fill="#475569">동일 조회 공유</text><path d="M 578 228 H 622" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="632" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="656" y="213" font-size="27" font-weight="700">사실 구분</text><text x="656" y="254" font-size="19" fill="#475569">존재·운행·시각</text><path d="M 870 228 H 914" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="924" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="948" y="213" font-size="27" font-weight="700">응답·화면</text><text x="948" y="254" font-size="19" fill="#475569">출처·UNKNOWN</text>
<text x="48" y="363" font-size="21" fill="#334155">실 API 모드에서는 빠진 정보를 합성 값으로 채우지 않습니다. 실패한 조회는 정상 캐시로 남기지 않습니다.</text>
</g></svg>
